source = ~/.config/hypr/hyprlock-colors.conf

background {
  monitor =
  path = /home/daniel/.config/wallpapers/japan-night.jpg
  blur_passes = 3
  blur_size = 12
  brightness = 0.35
  saturation = 0.85
}

# top-left: session suspended
label {
  monitor =
  text = SESSION SUSPENDED
  font_size = 13
  font_family = JetBrainsMono Nerd Font
  color = rgba(240, 201, 135, 0.95)
  position = 40, -40
  halign = left
  valign = top
}
label {
  monitor =
  text = // ICE ACTIVE
  font_size = 13
  font_family = JetBrainsMono Nerd Font
  color = rgba(214, 90, 68, 0.95)
  position = 285, -40
  halign = left
  valign = top
}

# top-right: host / profile
label {
  monitor =
  text = HOST LAPTOP // UPLINK HOME
  font_size = 12
  font_family = JetBrainsMono Nerd Font
  color = rgba(216, 197, 174, 0.7)
  position = -40, -40
  halign = right
  valign = top
}
label {
  monitor =
  text = PROFILE // WARM
  font_size = 12
  font_family = JetBrainsMono Nerd Font
  color = rgba(216, 197, 174, 0.5)
  position = -40, -66
  halign = right
  valign = top
}

# giant clock
label {
  monitor =
  text = $TIME
  font_size = 110
  font_family = JetBrainsMono Nerd Font
  color = rgba(232, 221, 208, 1.0)
  position = 0, 180
  halign = center
  valign = center
}

# operator + date under clock
label {
  monitor =
  text = OPERATOR // DANIEL
  font_size = 14
  font_family = JetBrainsMono Nerd Font
  color = rgba(216, 197, 174, 0.8)
  position = 0, 60
  halign = center
  valign = center
}
label {
  monitor =
  text = $LONGDAY
  font_size = 13
  font_family = JetBrainsMono Nerd Font
  color = rgba(216, 197, 174, 0.55)
  position = 0, 28
  halign = center
  valign = center
}

# auth panel
label {
  monitor =
  text = AUTH // PASSPHRASE
  font_size = 12
  font_family = JetBrainsMono Nerd Font
  color = rgba(240, 201, 135, 0.9)
  position = 0, -40
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 420, 54
  outline_thickness = 1
  dots_size = 0.25
  dots_spacing = 0.35
  dots_center = true
  fade_on_empty = false
  font_color = rgba(232, 221, 208, 1.0)
  inner_color = rgba(20, 12, 7, 0.55)
  outer_color = rgba(214, 143, 92, 0.5)
  check_color = rgba(240, 201, 135, 0.9)
  fail_color = rgba(214, 90, 68, 1.0)
  placeholder_text = ENTER PASSPHRASE TO RESUME SESSION
  hide_input = false
  position = 0, -90
  halign = center
  valign = center
}

# bottom status line
label {
  monitor =
  text = QUEUE CLEARED   VULN 0 AFFECTED   ICE NOMINAL
  font_size = 11
  font_family = JetBrainsMono Nerd Font
  color = rgba(216, 197, 174, 0.4)
  position = 40, 36
  halign = left
  valign = bottom
}
label {
  monitor =
  text = PWR $BATTERY
  font_size = 11
  font_family = JetBrainsMono Nerd Font
  color = rgba(216, 197, 174, 0.4)
  position = -40, 36
  halign = right
  valign = bottom
}
