# Monitor (managed live by kanshi + screen watchdog)
$terminal = kitty
$menu = rofi -show drun
$mainMod = SUPER

# Autostart
exec-once = waybar
exec-once = swww-daemon && swww img ~/.config/wallpapers/warm-dark.png
exec-once = dbus-update-activation-environment --all
exec-once = systemctl --user import-environment PATH
exec-once = blueman-applet
exec-once = mako
exec-once = kanshi -c /home/daniel/.config/kanshi/config
exec-once = laptop-screen-watchdog
exec-once = hypridle

# Input
input {
  kb_layout = se
  follow_mouse = 1
  touchpad {
    natural_scroll = true
  }
  sensitivity = 0
}

general {
  gaps_in = 8
  gaps_out = 16
  border_size = 2
  col.active_border = rgba(d68f5cee) rgba(f0c98755) 45deg
  col.inactive_border = rgba(3a2c22aa)
  layout = dwindle
  resize_on_border = true
}

decoration {
  rounding = 12
  active_opacity = 1.0
  inactive_opacity = 0.94
  shadow {
    enabled = true
    range = 18
    render_power = 3
    color = rgba(0a0605aa)
  }
  blur {
    enabled = true
    size = 5
    passes = 2
    vibrancy = 0.17
    noise = 0.02
  }
}

animations {
  enabled = true
  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = liner, 1, 1, 1, 1
  animation = windows, 1, 6, wind, slide
  animation = windowsIn, 1, 6, winIn, slide
  animation = windowsOut, 1, 5, winOut, slide
  animation = windowsMove, 1, 5, wind, slide
  animation = border, 1, 1, liner
  animation = fade, 1, 8, default
  animation = workspaces, 1, 5, wind, slidevert
  animation = borderangle, 1, 60, liner, loop
}

dwindle {
  preserve_split = true
}

xwayland {
  force_zero_scaling = true
}

# Keybindings
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $terminal -e yazi
bind = $mainMod, V, togglefloating
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, L, exec, pidof hyprlock || hyprlock

# Windows focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Windows to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Mouse - move/resize window with SUPER + drag
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:275, resizewindow

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Volume controls (PipeWire)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media controls
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Window rules (Hyprland 0.55+ syntax)
windowrule = float, class:(blueman-manager)
windowrule = float, class:(Rofi)
