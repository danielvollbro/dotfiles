# Monitor
# monitor=eDP-1,3840x2160@60,0x0,1.67

$terminal = kitty
$menu = wofi --show drun
$mainMod = SUPER

# Autostart
exec-once = waybar
exec-once = hyprpaper
exec-once = dbus-update-activation-environment --all
exec-once = systemctl --user import-environment PATH
exec-once = blueman-applet
exec-once = mako
exec-once = kanshi -c /home/daniel/.config/kanshi/config

#input
input {
  kb_layout = se
  follow_mouse = 1
  touchpad {
    natural_scroll = true
  }
  sensitivity = 0
}

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = rgba(89b4faee)
  col.inactive_border = rgba(595959aa)
  layout = dwindle
}

decoration {
  rounding = 8
  blur {
    enabled = true
    size = 3
    passes = 1
  }
}

animations {
  enabled = true
}

dwindle {
  preserve_split = true
}

xwayland {
  force_zero_scaling = true
}

# Keybindings
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $terminal -e yazi
bind = $mainMod, V, togglefloating
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo
bind = $mainMod, J, layoutmsg, togglesplit

# Windows focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move Windows to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3

# Mouse - move/resize window with SUPER + drag
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:275, resizewindow

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Volume controls (PipeWire)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media controls
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
