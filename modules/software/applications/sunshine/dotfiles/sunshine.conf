csrf_allowed_origins = https://sunshine.home.vollbro.com
# Switch display to the client's resolution on session start, restore 1080p on
# disconnect. Sunshine runs prep commands WITHOUT a shell, so $VARS in the
# command string never expand — the script reads SUNSHINE_CLIENT_WIDTH/HEIGHT/
# FPS from its environment instead (set during the session, absent on undo).
# NOTE: elevated must stay false — with elevated:true the script runs as root
# and kscreen-doctor cannot reach the user's KDE session over DBus.
global_prep_cmd = [
  {
    "do":"/home/daniel/.config/sunshine/sunshine-switch-mode.sh",
    "elevated":false,
    "undo":"/home/daniel/.config/sunshine/sunshine-switch-mode.sh"
  }
]
