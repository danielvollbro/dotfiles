csrf_allowed_origins = https://sunshine.home.vollbro.com
# Switch display to the client's resolution on session start (Sunshine exports
# SUNSHINE_CLIENT_WIDTH/HEIGHT/FPS, passed through as args by do_cmd), restore
# 1080p on disconnect. Script deployed next to this file via home-manager.
do_cmd = sunshine-switch-mode.sh $SUNSHINE_CLIENT_WIDTH $SUNSHINE_CLIENT_HEIGHT $SUNSHINE_CLIENT_FPS
undo_cmd = sunshine-switch-mode.sh
