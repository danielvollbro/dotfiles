csrf_allowed_origins = https://sunshine.home.vollbro.com
# Mode switching is done per-app via apps.json prep-cmd (Desktop): app-level
# prep commands receive SUNSHINE_CLIENT_WIDTH/HEIGHT/FPS in their environment,
# global_prep_cmd does NOT (they are unset there, so the script would always
# take the 1080p fallback). The script switches to the client resolution on
# session start and falls back to 1080p when the vars are absent (undo).
global_prep_cmd = [
  {
    "do": "/home/daniel/.config/sunshine/sunshine-switch-mode.sh",
    "elevated": false,
    "undo": "/home/daniel/.config/sunshine/sunshine-switch-mode.sh --fallback"
  }
]
