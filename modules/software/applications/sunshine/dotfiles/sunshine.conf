csrf_allowed_origins = https://sunshine.home.vollbro.com
# Switch display to the client's resolution on session start (Sunshine exports
# SUNSHINE_CLIENT_WIDTH/HEIGHT/FPS, available to prep commands), restore 1080p
# on disconnect. Script deployed next to this file via home-manager.
# NOTE: elevated must stay false — with elevated:true the script runs as root
# and kscreen-doctor cannot reach the user's KDE session over DBus.
global_prep_cmd = [
  {
    "do":"/home/daniel/.config/sunshine/sunshine-switch-mode.sh $SUNSHINE_CLIENT_WIDTH $SUNSHINE_CLIENT_HEIGHT $SUNSHINE_CLIENT_FPS",
    "elevated":false,
    "undo":"/home/daniel/.config/sunshine/sunshine-switch-mode.sh"
  }
]
